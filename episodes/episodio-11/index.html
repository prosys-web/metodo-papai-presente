<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Método Presença — As Aventuras de Ester — Ep. 11</title>
<link rel="stylesheet" href="../../css/base.css">
<!--
  Episódio 11 — A Trilha das Perguntas 🔎
  Sem personagens novos. Retorno do Tito (reapresentação breve, não do zero).
  Valor: curiosidade (perguntar sem medo de não saber).
  Continuidade: finalmente exploram a trilha que o Carvalho revelou no Ep.7.
  Mistério da semente se expande (outros brotinhos) — não resolve nada.

  ÁUDIO DO PAPAI (opcional) — pasta audio/ ao lado deste arquivo:
    audio01.mp3  "Hoje vamos seguir a trilha que o Carvalho nos mostrou."
    audio02.mp3  "Olha isso... o que será?"
    audio03.mp3  "Não sabemos ainda. E tudo bem perguntar."
    audio04.mp3  "Tito! Que bom te ver de novo!"
    audio05.mp3  "O que você acha que pode ser, Ester?"
    audio06.mp3  "Uau... tantos brotinhos!"
    audio07.mp3  "Perguntar é o primeiro passo pra descobrir."
    audio08.mp3  "Você fez ótimas perguntas hoje, Ester!"
    audio09.mp3  "Até a nossa próxima aventura!"
-->
<style>
  :root{
    --ceu1:#EAF0FF; --ceu2:#D3E0FB; --ceu3:#B8CDF5;
    --creme:#FFFBF2; --azul:#4E7FE0; --azul-dark:#2F5AB0;
    --gold:#F2C94C; --ameixa:#1B2340; --verde:#1F7A4D;
  }
  html,body{ background: linear-gradient(180deg, var(--ceu3) 0%, var(--ceu2) 45%, var(--ceu1) 100%); color:var(--ameixa); }
  #progress-fill{ background: linear-gradient(90deg, var(--azul), var(--gold), var(--verde)); }
  h1.title-plaque{ color:var(--azul-dark); border:4px dashed var(--gold); }
  .episode-tag{ background:var(--azul); }
  p.speech{ color:var(--ameixa); }
  .papai-card{ background:#EEF2FF; border-color:var(--azul); color:var(--azul-dark); }
  .papai-card .tag{ background:var(--azul); }
  .btn{ background:linear-gradient(180deg,var(--azul),var(--azul-dark)); box-shadow:0 6px 0 #1E3D80,0 8px 16px rgba(0,0,0,0.15); }
  .btn.secondary{ background:linear-gradient(180deg,#FFE07D,var(--gold)); box-shadow:0 6px 0 #D9A521,0 8px 16px rgba(0,0,0,0.15); color:var(--ameixa); }
  .card{ background:var(--creme); }
  #sky{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .hill-em{ position:absolute; bottom:0; left:0; width:100%; height:20%; background:var(--azul); border-radius:50% 50% 0 0/100% 100% 0 0; transform:scaleX(1.4); opacity:0.16; }
  .char-frame{ display:flex; justify-content:center; margin:6px 0 10px; }
  .char-frame img{ width:108px; height:auto; border-radius:20px; background:#fff; padding:6px; box-shadow:0 6px 16px rgba(20,30,60,0.18); animation:char-bounce 2s ease-in-out infinite; }
  .char-frame.small img{ width:60px; }
  .char-frame.big img{ width:145px; }
  @keyframes char-bounce{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-8px) rotate(2deg);} }
  .char-row{ display:flex; justify-content:center; gap:10px; align-items:flex-end; margin-bottom:6px; flex-wrap:wrap; }
  .mystery-sign{ font-size:2.4rem; text-align:center; margin:8px 0; animation:mystery-glow 1.8s ease-in-out infinite; }
  @keyframes mystery-glow{ 0%,100%{ opacity:0.6;} 50%{ opacity:1;} }
  .sprouts-row{ display:flex; justify-content:center; gap:8px; font-size:1.8rem; flex-wrap:wrap; margin:10px 0; }
  .night-card{ background:radial-gradient(ellipse at top, #2F4A9A, #10162E); border-radius:32px; padding:24px 20px; color:#fff; }
  .night-card p.speech{ color:#EEF2FF; }
  .night-card .papai-card{ background:rgba(255,255,255,0.14); border-color:#EEF2FF; color:#EEF2FF; }
  .night-card .papai-card .tag{ background:#EEF2FF; color:var(--azul-dark); }
  @media (max-width:360px){ h1.title-plaque{ font-size:1.15rem;} }
</style>
</head>
<body>
<div id="app">
  <div id="sky"><div class="hill-em"></div></div>
  <button id="info-btn" title="Instruções para o papai">ℹ️</button>
  <div id="progress-wrap"><div id="progress-track"><div id="progress-fill"></div></div></div>
  <div id="stage"><div class="card" id="card"></div></div>
  <div id="nav">
    <button class="nav-btn" id="btn-back">◀ Voltar</button>
    <div class="nav-spacer"></div>
    <button class="nav-btn" id="btn-next">Próximo ▶</button>
  </div>
</div>
<div id="info-modal">
  <div class="box">
    <h3>🎙️ Voz do papai (opcional)</h3>
    <p>Pasta <code>episodes/episodio-11/audio/</code>, arquivos audio01 a audio09 — texto completo nos comentários do código-fonte.</p>
    <p>Tito retorna com uma reapresentação breve. Mistério da semente se expande — não revele nada sobre o que ela é.</p>
    <button class="btn secondary" onclick="document.getElementById('info-modal').classList.remove('open')">Entendi!</button>
  </div>
</div>
<script src="../../js/core.js"></script>
<script>
const IMG = {
  aurora: '../../assets/characters/aurora/aurora-sorrindo.webp',
  lumi: '../../assets/characters/lumi/lumi-sorrindo.webp',
  fog_curioso: '../../assets/characters/foguinho/foguinho-curioso.webp',
  fog_empolgado: '../../assets/characters/foguinho/foguinho-empolgado.webp',
  fog_comemorando: '../../assets/characters/foguinho/foguinho-comemorando.webp',
  tito_curioso: '../../assets/characters/tito/tito-curioso.webp',
  tito_surpreso: '../../assets/characters/tito/tito-surpreso.webp',
  tito_comemorando: '../../assets/characters/tito/tito-comemorando.webp',
};
function charImg(src, cls){ return `<img src="${src}" alt="" class="${cls||''}">`; }
const state = { scene:0, hugClicks:0 };
const cardEl = document.getElementById('card');
const fillEl = document.getElementById('progress-fill');
const backBtn = document.getElementById('btn-back');
const nextBtn = document.getElementById('btn-next');
const skyEl = document.getElementById('sky');
const TOTAL_SCENES = 11;
document.getElementById('info-btn').onclick = ()=> document.getElementById('info-modal').classList.add('open');
seedBackgroundStars(skyEl, 6);

function renderScene(){
  const s = state.scene;
  backBtn.style.visibility = (s===0) ? 'hidden' : 'visible';
  nextBtn.style.visibility = 'visible';
  fillEl.style.width = (s/TOTAL_SCENES*100)+'%';
  let html = '';

  if(s===0){
    nextBtn.style.visibility = 'hidden';
    html = `
      <div class="night-card">
        <div class="mystery-sign">🌳➜🔎</div>
        <p class="speech">Hoje é o dia. Vamos finalmente seguir a trilha que o Carvalho mostrou, lá atrás.</p>
        ${papaiCard('Hoje vamos seguir a trilha que o Carvalho nos mostrou.', 'Retomando um gancho antigo do Ep.7 — a trilha nunca tinha sido explorada.')}
        <div class="btn-row"><button class="btn huge" id="continue-btn">✨ Continuar</button></div>
      </div>`;
  }
  else if(s===1){
    html = `
      <div class="char-frame">${charImg(IMG.fog_curioso)}</div>
      <div class="mystery-sign">👣✨</div>
      <p class="speech">Uma pegada brilhante no chão... ninguém sabe de quem é.</p>
      ${papaiCard('Olha isso... o que será?', 'Primeiro sinal misterioso da trilha. Não precisa explicar — só notar junto com a Ester.')}
      <div class="btn-row"><button class="btn secondary" id="continue-btn">Continuar ➜</button></div>`;
  }
  else if(s===2){
    html = `
      <div class="char-frame">${charImg(IMG.aurora)}</div>
      <p class="speech">"Não sabemos ainda. E tudo bem perguntar."</p>
      <p class="speech" style="font-size:0.9rem; font-style:italic;">Aurora não dá a resposta — ela mostra que perguntar já é parte da descoberta.</p>
      ${papaiCard('Não sabemos ainda. E tudo bem perguntar.', 'O coração do valor do episódio: curiosidade sem medo de não saber.')}
      <div class="btn-row"><button class="btn secondary" id="continue-btn">Continuar ➜</button></div>`;
  }
  else if(s===3){
    html = `
      <div class="char-frame">${charImg(IMG.tito_surpreso)}</div>
      <p class="speech" style="font-weight:800;">"Tito?! Que bom te ver de novo!"</p>
      <p class="speech" style="font-size:0.9rem; font-style:italic;">O elefantinho amigo do Carvalho e das aventuras passadas — também curioso com a trilha.</p>
      ${papaiCard('Tito! Que bom te ver de novo!', 'Reapresentação breve — a Ester já conhece o Tito, só relembre rapidinho quem ele é.')}
      <div class="btn-row"><button class="btn secondary" id="continue-btn">Continuar ➜</button></div>`;
  }
  else if(s===4){
    html = `
      <div class="char-row">
        <div class="char-frame small">${charImg(IMG.lumi)}</div>
        <div class="char-frame">${charImg(IMG.tito_curioso)}</div>
      </div>
      <div class="mystery-sign">💡💡</div>
      <p class="speech">Juntos, seguem a trilha — mais luzinhas piscando entre as árvores.</p>
      ${papaiCard(null, 'Lumi se junta ao grupo. As luzes aumentam aos poucos, criando expectativa.')}
      <div class="btn-row"><button class="btn secondary" id="continue-btn">Continuar ➜</button></div>`;
  }
  else if(s===5){
    html = `
      <p class="speech">O que você acha que pode ser, Ester?</p>
      ${conversaCard('O que será que tem no fim dessa trilha?')}
      <div class="btn-row"><button class="btn secondary" id="continue-btn">Vamos descobrir ➜</button></div>`;
  }
  else if(s===6){
    html = `
      <div class="char-row">
        <div class="char-frame small">${charImg(IMG.fog_empolgado)}</div>
        <div class="char-frame small">${charImg(IMG.tito_surpreso)}</div>
      </div>
      <div class="sprouts-row">🌱🌱✨🌱🌱</div>
      <p class="speech" style="font-weight:800;">"Uau... tantos brotinhos!"</p>
      <p class="speech" style="font-size:0.9rem; font-style:italic;">Uma clareira cheia de pequenos brotos verdes brilhantes, iguaizinhos ao da Sofia.</p>
      ${papaiCard('Uau... tantos brotinhos!', 'O mistério se expande — não é só um brotinho especial, existem vários. Não explique o porquê.')}
      <div class="btn-row"><button class="btn secondary" id="continue-btn">Continuar ➜</button></div>`;
  }
  else if(s===7){
    html = `
      <div class="char-frame">${charImg(IMG.aurora)}</div>
      <p class="speech">"Perguntar é o primeiro passo pra descobrir."</p>
      <p class="speech" style="font-size:0.9rem;">Nem toda pergunta precisa de resposta agora — algumas a gente carrega pra próxima aventura.</p>
      ${papaiCard('Perguntar é o primeiro passo pra descobrir.', 'Fechamento do valor do episódio, leve, sem virar sermão.')}
      <div class="btn-row"><button class="btn secondary" id="continue-btn">Continuar ➜</button></div>`;
  }
  else if(s===8){
    html = `
      <div class="char-row">
        <div class="char-frame small">${charImg(IMG.fog_comemorando)}</div>
        <div class="char-frame">${charImg(IMG.tito_comemorando)}</div>
        <div class="char-frame small">${charImg(IMG.lumi)}</div>
      </div>
      <p class="speech">Todos comemoram a descoberta da clareira! 🎉</p>
      ${papaiCard(null, 'Cada clique traz uma combinação diferente de corações, flores, estrelas e brilhos.')}
      <div class="btn-row"><button class="btn huge" id="celebrate-btn">🎉 Comemorar!</button></div>
      <div class="btn-row"><button class="nav-btn" id="continue-btn">Continuar ➜</button></div>`;
  }
  else if(s===9){
    nextBtn.style.visibility = 'hidden';
    html = `
      <div class="char-frame big">${charImg(IMG.fog_curioso)}</div>
      <p class="speech" style="font-weight:800;">❤️ "Você fez ótimas perguntas hoje!"</p>
      ${papaiCard('Você fez ótimas perguntas hoje, Ester!')}
      <div class="btn-row"><button class="btn huge" id="hug-btn">🤗 ABRAÇO DO PAPAI</button></div>
      <p class="speech" style="font-size:0.95rem;">❤️ 🌸 ⭐ ✨ — pode clicar quantas vezes quiser</p>
      <div class="btn-row"><button class="nav-btn" id="ending-btn">Continuar ➜</button></div>`;
  }
  else if(s===10){
    nextBtn.style.visibility = 'hidden';
    html = `
      <div class="night-card">
        <div class="sprouts-row">🌱✨🌱</div>
        <p class="speech" style="font-size:0.95rem; font-style:italic;">Os brotinhos brilham juntos, baixinho, como se estivessem esperando alguma coisa...</p>
        <p class="speech" style="font-weight:800; margin-top:14px;">Continua...</p>
        ${papaiCard('Até a nossa próxima aventura!', 'Fade final. Som: vento leve.')}
        <div class="btn-row"><button class="nav-btn" id="restart-btn">Reviver a aventura 🔁</button></div>
      </div>`;
  }

  cardEl.innerHTML = html;
  attachSceneEvents();
}

function attachSceneEvents(){
  const s = state.scene;
  if(s===0){ playVoice('audio01'); playSfx('weather/vento-leve',[400,350]); document.getElementById('continue-btn').onclick = ()=> goTo(1); }
  if(s===1){ playVoice('audio02'); sparkles(6); document.getElementById('continue-btn').onclick = ()=> goTo(2); }
  if(s===2){ playSfx('characters/aurora-sino',[880,1100]); playVoice('audio03'); document.getElementById('continue-btn').onclick = ()=> goTo(3); }
  if(s===3){ playVoice('audio04'); playSfx('characters/tito-elefantinho',[440,660]); document.getElementById('continue-btn').onclick = ()=> goTo(4); }
  if(s===4){ playSfx('characters/aurora-bater-asas',[500,650]); document.getElementById('continue-btn').onclick = ()=> goTo(5); }
  if(s===5){ playVoice('audio05'); document.getElementById('continue-btn').onclick = ()=> goTo(6); }
  if(s===6){ playVoice('audio06'); crystalShine(8); document.getElementById('continue-btn').onclick = ()=> goTo(7); }
  if(s===7){ playVoice('audio07'); document.getElementById('continue-btn').onclick = ()=> goTo(8); }
  if(s===8){
    document.getElementById('celebrate-btn').onclick = ()=>{
      hearts(12); setTimeout(()=>flowers(14),300); setTimeout(()=>sparkles(12),600); setTimeout(()=>confetti(26),900);
    };
    document.getElementById('continue-btn').onclick = ()=>{ playVoice('audio08'); goTo(9); };
  }
  if(s===9){
    document.getElementById('hug-btn').onclick = ()=>{ state.hugClicks++; hugCelebration(); };
    document.getElementById('ending-btn').onclick = ()=> goTo(10);
  }
  if(s===10){
    playVoice('audio09');
    document.getElementById('restart-btn').onclick = ()=>{ state.scene=0; state.hugClicks=0; goTo(0); };
  }
}
function goTo(idx){ state.scene = Math.max(0, Math.min(TOTAL_SCENES, idx)); renderScene(); }
backBtn.onclick = ()=> goTo(state.scene-1);
nextBtn.onclick = ()=> goTo(state.scene+1);
renderScene();
</script>
</body>
</html>
